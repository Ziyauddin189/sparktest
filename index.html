<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Spark Academy · Exam Results</title>
  <style>
    /* ---------- reset & base ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f4f7fc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
      line-height: 1.5;
      color: #1e2b3a;
    }

    /* ---------- main card container ---------- */
    .result-wrapper {
      max-width: 820px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25), 0 8px 24px -6px rgba(0, 0, 0, 0.08);
      padding: 2rem 2rem 2.5rem;
      transition: box-shadow 0.2s;
    }

    /* ---------- header ---------- */
    .academy-header {
      text-align: center;
      border-bottom: 2px solid #eef3f8;
      padding-bottom: 1rem;
      margin-bottom: 1.8rem;
    }

    .academy-header img.banner {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 16px;
    }

    /* ---------- search section ---------- */
    .search-section {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
      background: #f8faff;
      padding: 1.2rem 1.5rem;
      border-radius: 60px;
      margin-bottom: 1.8rem;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
    }

    .search-section input {
      flex: 2 1 220px;
      min-width: 180px;
      padding: 0.75rem 1.2rem;
      border: 1px solid #d9e2ec;
      border-radius: 40px;
      font-size: 1rem;
      background: white;
      transition: border 0.15s, box-shadow 0.15s;
      outline: none;
      font-weight: 450;
      color: #1a2b3c;
    }

    .search-section input::placeholder {
      color: #8ba0b5;
      font-weight: 400;
    }

    .search-section input:focus {
      border-color: #2a7de1;
      box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.15);
    }

    .search-section button {
      flex: 0 0 auto;
      background: #0b2a41;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 4px 8px -2px rgba(11, 42, 65, 0.2);
      white-space: nowrap;
    }

    .search-section button:hover {
      background: #1a3f5e;
    }

    .search-section button:active {
      transform: scale(0.96);
      background: #0a2539;
    }

    /* ---------- error message ---------- */
    .error-msg {
      background: #fef0ee;
      color: #b34033;
      padding: 0.8rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      text-align: center;
      margin-top: -0.5rem;
      margin-bottom: 1.2rem;
      border-left: 4px solid #b34033;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    /* ---------- result card (hidden initially) ---------- */
    .result-card {
      display: none;
      animation: fadeSlide 0.35s ease forwards;
      margin-top: 0.5rem;
    }

    .result-card.show {
      display: block;
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ---------- student info ---------- */
    .student-info {
      background: #f9fcff;
      border-radius: 24px;
      padding: 1.5rem 1.8rem;
      margin-bottom: 1.8rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1.8rem;
      border: 1px solid #eaf1f8;
    }

    .info-item {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      padding: 0.25rem 0;
    }

    .info-item .label {
      font-weight: 500;
      color: #436074;
      min-width: 100px;
      font-size: 0.9rem;
      letter-spacing: 0.2px;
    }

    .info-item .value {
      font-weight: 600;
      color: #0b2a41;
      word-break: break-word;
    }

    .info-item .value.highlight {
      background: #e2edfb;
      padding: 0.1rem 0.8rem;
      border-radius: 30px;
      font-size: 1.1rem;
    }

    /* ---------- marks table ---------- */
    .marks-section {
      background: white;
      border-radius: 20px;
      border: 1px solid #eaf1f8;
      overflow: hidden;
      margin-bottom: 1.2rem;
    }

    .marks-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.98rem;
    }

    .marks-table th {
      background: #f2f7fd;
      color: #1d3b54;
      font-weight: 600;
      padding: 0.9rem 1rem;
      text-align: left;
      border-bottom: 2px solid #d9e2ec;
      letter-spacing: 0.3px;
    }

    .marks-table td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #e9eff5;
      color: #1f3346;
    }

    .marks-table tr:last-child td {
      border-bottom: none;
    }

    .marks-table .subject-cell {
      font-weight: 500;
    }

    .marks-table .score-cell {
      font-weight: 600;
    }

    /* total score row */
    .total-row td {
      background: #f2f8ff;
      font-weight: 700;
      padding: 0.9rem 1rem;
      border-top: 2px solid #cbdae7;
      color: #0b2a41;
    }

    .total-row .total-label {
      text-align: right;
      padding-right: 1rem;
      font-weight: 600;
      color: #1d3b54;
    }

    .total-row .total-value {
      font-size: 1.2rem;
      background: #0b2a41;
      color: white;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      display: inline-block;
      letter-spacing: 0.5px;
    }

    /* ---------- footer / extra ---------- */
    .footer-note {
      text-align: center;
      font-size: 0.8rem;
      color: #7a94ab;
      margin-top: 1.5rem;
      border-top: 1px solid #eef3f8;
      padding-top: 1.2rem;
      letter-spacing: 0.3px;
    }

    /* ---------- responsive ---------- */
    @media (max-width: 640px) {
      .result-wrapper {
        padding: 1.5rem 1rem;
      }

      .search-section {
        border-radius: 40px;
        padding: 1rem 1.2rem;
        flex-direction: column;
        align-items: stretch;
        background: #f8faff;
      }

      .search-section input {
        flex: 1 1 auto;
        width: 100%;
        min-width: unset;
      }

      .search-section button {
        width: 100%;
        justify-content: center;
        padding: 0.75rem;
      }

      .student-info {
        grid-template-columns: 1fr;
        gap: 0.25rem;
        padding: 1.2rem;
      }

      .info-item .label {
        min-width: 80px;
      }

      .marks-table th,
      .marks-table td {
        padding: 0.6rem 0.7rem;
        font-size: 0.9rem;
      }

      .total-row .total-value {
        font-size: 1rem;
        padding: 0.1rem 1rem;
      }
    }

    @media (max-width: 420px) {
      .result-wrapper {
        padding: 1rem 0.75rem;
      }
    }
  </style>
</head>

      <div class="info-item" style="grid-column: 1 / -1; margin-top: 0.2rem;">
        <span class="label">Total Score</span>
        <span class="value highlight" id="studentTotal">—</span>
      </div>
    </div>

    <!-- marks table -->

      <table class="marks-table" id="marksTable">
        <thead>
          <tr><th>Subject</th><th>Max Marks</th><th>Score</th></tr>
        </thead>
        <tbody id="marksTableBody">

        <tfoot id="marksTableFoot">
          <tr class="total-row">
            <td colspan="2" class="total-label">Total</td>
            <td class="total-value" id="totalScoreFooter">—</td>
          </tr>
        </tfoot>
      </table>
    </div>

  </div><!-- /result-card -->

  <div class="footer-note">© 2026 Spark Academy · Results published by Spark Academy, Nellore</div>
</div>

  /* ============================================================

  (function() {
    // DOM refs
    const input = document.getElementById('hallTicketInput');
    const btn = document.getElementById('viewResultBtn');
    const errorMsg = document.getElementById('errorMsg');
    const resultCard = document.getElementById('resultCard');

    // student info fields
    const studentName = document.getElementById('studentName');
    const studentHallTicket = document.getElementById('studentHallTicket');
    const studentBatch = document.getElementById('studentBatch');
    const studentSchool = document.getElementById('studentSchool');
    const studentTotal = document.getElementById('studentTotal');
    const totalScoreFooter = document.getElementById('totalScoreFooter');
    const marksTableBody = document.getElementById('marksTableBody');

    // Helper: clear error & hide result
    function resetUI() {
      errorMsg.classList.remove('show');
      resultCard.classList.remove('show');
    }

    // Render result for a given hall ticket
    function renderResult(hallTicket) {
      const student = results[hallTicket];
      if (!student) {
        // show error
        errorMsg.classList.add('show');
        resultCard.classList.remove('show');
        return;
      }

      // hide error, show card
      errorMsg.classList.remove('show');
      resultCard.classList.add('show');

      // --- fill student info ---
      studentName.textContent = student.name || '—';
      studentHallTicket.textContent = hallTicket;
      studentBatch.textContent = student.batch || '—';
      studentSchool.textContent = student.schoolName || '—';
      const totalDisplay = student.totalScore || '—';
      studentTotal.textContent = totalDisplay;
      totalScoreFooter.textContent = totalDisplay;

      // --- build marks table ---
      const subjects = student.subjects || [];
      let html = '';
      if (subjects.length === 0) {
        html = `<tr><td colspan="3" style="text-align:center; color:#6b7f93;">No subject data</td></tr>`;
      } else {
        subjects.forEach(sub => {
          const subjectName = sub.subject || '—';
          const maxMarks = sub.maxMarks !== undefined ? sub.maxMarks : '—';
          const score = sub.score !== undefined ? sub.score : '—';
          html += `<tr>
            <td class="subject-cell">${subjectName}</td>
            <td>${maxMarks}</td>
            <td class="score-cell">${score}</td>
          </tr>`;
        });
      }
      marksTableBody.innerHTML = html;
    }

    // Handle search
    function handleSearch() {
      const raw = input.value.trim();
      if (raw === '') {
        // if empty, hide result & show error? we choose to show error
        errorMsg.textContent = 'Please enter a Hall Ticket Number.';
        errorMsg.classList.add('show');
        resultCard.classList.remove('show');
        return;
      }
      // reset error text to default
      errorMsg.textContent = 'No result found for this Hall Ticket Number.';
      renderResult(raw);
    }

    // Event listeners
    btn.addEventListener('click', handleSearch);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSearch();
      }
    });

    // On page load: don't show any result, just the empty search box
    // with its hint text ("Enter Hall Ticket Number").
    resetUI();
  })();
